name: iOS build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test (simulator)
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          xcodebuild test -project Phildit.xcodeproj -scheme Phildit \
            -destination "id=$DEST" CODE_SIGNING_ALLOWED=NO | tee build.log | tail -n 200
      - name: Build unsigned IPA
        run: |
          xcodebuild build -project Phildit.xcodeproj -scheme Phildit -configuration Release \
            -sdk iphoneos -derivedDataPath dd CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload && cp -R dd/Build/Products/Release-iphoneos/Phildit.app Payload/
          zip -qr Phildit-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Phildit-unsigned-ipa
          path: Phildit-unsigned.ipa
