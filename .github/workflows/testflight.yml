name: TestFlight
# Manual (Actions tab > TestFlight > Run workflow) or by pushing a tag like v1.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  upload:
    runs-on: macos-latest
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v"; exit 1; }
          done
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || { echo "::error::Missing secret ASC_KEY_P8"; exit 1; }
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write App Store Connect API key
        run: |
          echo "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/AuthKey.p8"
          sed -i '' "s/__TEAM_ID__/$TEAM_ID/" ExportOptions.plist
      - name: Generate project
        run: xcodegen generate
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive -project Phildit.xcodeproj -scheme Phildit -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Phildit.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tail -n 60
      - name: Export and upload to TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/Phildit.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 60
